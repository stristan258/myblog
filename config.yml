baseURL: "https://www.trisphoto.com/"
title:
paginate: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

taxonomies:
  place: places
  person: people

params:
  env: production
  mainSections:
    - posts
    - trips
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  profileMode:
    enabled: true
    title: Tristan Smith
    imageUrl: "/images/profile.jpg"
    imageTitle: "Tristan Smith"
    imageWidth: 250
    imageHeight: 250
    buttons:
      - name: Places
        url: /places/
      - name: Archives
        url: /archives/

  socialIcons:
    - name: strava
      url: "https://www.strava.com/athletes/31753850"
    - name: github
      url: "https://github.com/stristan258"
    - name: email
      url: "mailto:stristan258@gmail.com"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: trips
      name: Trips
      url: /trips/
      weight: 30
    - identifier: live track
      name: Live Track
      url: /live-track/
      weight: 40

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true