baseURL: "https://www.trisphoto.com/"
title: trisphoto
paginate: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

taxonomies:
  tag: tags
  trip: trips
  place: places
  person: people

params:
  env: production
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  socialIcons:

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: trips
      name: Trips
      url: /trips/
      weight: 10
    - identifier: places
      name: Places
      url: /places/
      weight: 20
    - identifier: people
      name: People
      url: /people/
      weight: 30
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 40

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false