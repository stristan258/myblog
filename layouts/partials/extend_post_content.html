<ul class="post-tags" aria-label="Places and archive">
{{- with .GetTerms "places" }}
  {{- range . }}
  <li><a href="{{ .RelPermalink }}" aria-current="location">{{ .LinkTitle }}</a></li>
  {{- end }}
{{- end }}
{{- if not .Date.IsZero }}
{{- $year := .Date.Format "2006" }}
{{- $month := .Date.Format "January" }}
  <li><a href="{{ "/archives/" | relLangURL }}#{{ $year }}" aria-current="date">{{ $year }}</a></li>
  <li><a href="{{ "/archives/" | relLangURL }}#{{ $year }}-{{ $month }}" aria-current="date">{{ $month }}</a></li>
{{- end }}
</ul>
